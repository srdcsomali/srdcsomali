<!-- Opportunities – SRDC | Consultancy opportunities, requests for proposals, research assignments, training, partnerships and careers at SRDC. | opportunities -->
<section class="ph"><div class="wrap"><p class="crumb"><a href="/">Home</a> / Opportunities</p><h1>Opportunities</h1><p class="lead">Consultancies, expressions of interest, requests for proposals, research assignments, enumerator recruitment, training, partnerships and careers.</p></div></section>
<section class="sec bg-blue"><div class="wrap"><div class="g g2" id="g"></div><div class="empty" id="e">There are no open opportunities at the moment. Partners are welcome to <a href="/contact?category=Partnership+Opportunities">send a partnership inquiry</a>.</div></div></section>
<!--JS-->
<script>(async()=>{const{$,esc,br,sb,media,fd}=SRDC;if(!sb)return;const{data}=await sb.from("opportunities").select("*").order("published_at",{ascending:false}),O=data||[],today=new Date().toISOString().slice(0,10);
 $("#g").innerHTML=O.map(x=>{const c=x.closing_date&&x.closing_date<today;return`<div class="card ac"><p class="tag">${esc(x.opportunity_type)}${x.location?" · "+esc(x.location):""}</p><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p>${x.closing_date?`<p><b>${c?"Closed":"Closing date"}:</b> ${fd(x.closing_date)}</p>`:""}${x.description||x.how_to_apply?`<details><summary>Details and how to apply</summary><p>${br(x.description)}</p><p>${br(x.how_to_apply)}</p></details>`:""}${x.document_path?`<p><a href="${esc(media(x.document_path))}" target="_blank" rel="noopener">Download document</a></p>`:""}${x.apply_email&&!c?`<p><a class="btn sm" href="mailto:${esc(x.apply_email)}?subject=${encodeURIComponent("Application: "+x.title)}">Apply by email</a></p>`:""}</div>`}).join("");$("#e").hidden=O.length>0})()</script>
